<!doctype html>
<!-- Source for icons/og.png (the link-preview image). Regenerate with tools/make-og.sh -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 0 80px;
        box-sizing: border-box;
        background: radial-gradient(90% 120% at 25% 50%, #3a2a12 0%, #14110f 60%);
        color: #f4ece4;
        font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      }
      svg { flex: 0 0 400px; filter: drop-shadow(0 20px 40px rgba(0,0,0,.5)); }
      h1 { font-size: 92px; line-height: 1; margin: 0 0 24px; color: #f5a623; letter-spacing: -0.03em; }
      p { font-size: 40px; line-height: 1.25; margin: 0 0 36px; color: #f4ece4; }
      .url {
        display: inline-block;
        font-size: 30px;
        color: #a59a8f;
        border: 2px solid #3a312a;
        border-radius: 999px;
        padding: 10px 26px;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 200 200" width="400" height="400">
      <circle cx="100" cy="100" r="96" fill="#221d19" stroke="#3a312a" stroke-width="2" />
      <circle cx="100" cy="100" r="74" fill="#14110f" stroke="#3a312a" />
      <g id="ticks" stroke="#a59a8f" stroke-width="2.5"></g>
      <text x="100" y="24" fill="#e8553e" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">N</text>
      <text x="180" y="101" fill="#a59a8f" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">E</text>
      <text x="100" y="178" fill="#a59a8f" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">S</text>
      <text x="20" y="101" fill="#a59a8f" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle">W</text>
      <g transform="rotate(40 100 100)">
        <polygon points="100,30 113,100 100,92 87,100" fill="#f5a623" />
        <polygon points="100,170 113,100 100,108 87,100" fill="#4a3f36" />
        <circle cx="100" cy="100" r="12" fill="#2b241f" stroke="#f5a623" stroke-width="2" />
      </g>
      <text x="100" y="101" font-size="15" text-anchor="middle" dominant-baseline="middle">🍺</text>
    </svg>
    <div>
      <h1>Pub Compass</h1>
      <p>A compass that points to the nearest pub. Not that one? Tap “Nah, next one”.</p>
      <span class="url">pubwhichway.co.uk</span>
    </div>
    <script>
      const g = document.getElementById("ticks");
      for (let a = 0; a < 360; a += 30) {
        if (a % 90 === 0) continue;
        const t = document.createElementNS("http://www.w3.org/2000/svg", "line");
        Object.entries({ x1: 100, x2: 100, y1: 8, y2: 20, transform: `rotate(${a} 100 100)` }).forEach(([k, v]) => t.setAttribute(k, v));
        g.append(t);
      }
    </script>
  </body>
</html>
