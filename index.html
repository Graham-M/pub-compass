<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14110f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pub Compass" />
    <title>Pub Compass</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="start" class="screen">
      <h1>Pub Compass</h1>
      <p class="tagline">Points to the nearest pub. That's it.</p>
      <button id="find" class="btn primary huge">Find a pub 🍺</button>
      <p class="small">Needs your location and compass. Pub data © OpenStreetMap contributors.</p>
    </section>

    <section id="main" class="screen" hidden>
      <div class="compass">
        <div id="dial" class="dial">
          <span class="n">N</span>
        </div>
        <svg id="needle" class="needle" viewBox="0 0 100 100" aria-hidden="true">
          <polygon points="50,6 62,52 50,46 38,52" fill="#f5a623" />
          <polygon points="50,94 62,52 50,58 38,52" fill="#3a332d" />
          <circle cx="50" cy="52" r="4" fill="#14110f" />
        </svg>
      </div>

      <div class="info">
        <h2 id="name">…</h2>
        <p id="meta"></p>
        <a id="maps" class="btn" hidden target="_blank" rel="noopener">Open in maps ↗</a>
      </div>

      <p id="status" role="status" aria-live="polite"></p>
      <button id="retry" class="btn" hidden>Retry</button>

      <div class="controls">
        <button id="next" class="btn primary">Nah, next one</button>
        <div class="row">
          <button id="back" class="btn">← Back</button>
          <button id="reset" class="btn">Reset</button>
        </div>
      </div>
    </section>

    <script type="module" src="app.js"></script>
  </body>
</html>
