<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14110f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="pubwhichway" />
    <title>pubwhichway</title>
    <meta name="description" content="A compass that points to the nearest pub. Not that one? Tap “Nah, next one”." />
    <!-- Link previews (WhatsApp, iMessage, Slack…). Scrapers need absolute URLs here. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="pubwhichway" />
    <meta property="og:title" content="pubwhichway: which way to the nearest pub?" />
    <meta property="og:description" content="A compass that points to the nearest pub. Not that one? Tap “Nah, next one”." />
    <meta property="og:url" content="https://pubwhichway.co.uk/" />
    <meta property="og:image" content="https://pubwhichway.co.uk/icons/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A compass needle pointing to a pint, next to the word pubwhichway" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="start" class="screen">
      <h1>pubwhichway</h1>
      <p class="tagline">Points to the nearest pub. That's it.</p>
      <button id="find" class="btn primary huge">Find a pub 🍺</button>
      <p class="small">Needs your location and compass. Pub data © OpenStreetMap contributors.</p>
    </section>

    <section id="main" class="screen" hidden>
      <div id="compass" class="compass">
        <svg id="dial" class="dial" viewBox="0 0 200 200" aria-hidden="true">
          <circle cx="100" cy="100" r="96" class="rim" />
          <circle cx="100" cy="100" r="74" class="inner" />
          <g id="ticks"></g>
          <text x="100" y="24" class="cardinal north">N</text>
          <text x="180" y="105" class="cardinal">E</text>
          <text x="100" y="186" class="cardinal">S</text>
          <text x="20" y="105" class="cardinal">W</text>
        </svg>
        <svg id="needle" class="needle" viewBox="0 0 100 100" aria-hidden="true">
          <polygon points="50,8 61,52 50,46 39,52" class="tip" />
          <polygon points="50,92 61,52 50,58 39,52" class="tail" />
          <circle cx="50" cy="52" r="7" class="cap" />
        </svg>
        <div class="cap-emoji" aria-hidden="true">🍺</div>
      </div>

      <div class="middle">
        <div class="info">
          <h2 id="name">…</h2>
          <p id="meta"></p>
        </div>

        <article id="fact" class="fact" hidden>
          <h3>Did you know?</h3>
          <p id="fact-text"></p>
          <div id="chips" class="chips"></div>
          <div class="links">
            <a id="site" class="btn small-btn" hidden target="_blank" rel="noopener">🌐 Website</a>
            <a id="fact-source" class="source" hidden target="_blank" rel="noopener">From Wikipedia ↗</a>
          </div>
        </article>
      </div>

      <div class="status-row">
        <p id="status" role="status" aria-live="polite"></p>
        <button id="retry" class="btn small-btn" hidden>Retry</button>
      </div>

      <div class="controls">
        <button id="next" class="btn primary">Nah, next one</button>
        <div class="row">
          <button id="back" class="btn">← Back</button>
          <a id="maps" class="btn" hidden target="_blank" rel="noopener">🗺️ Maps</a>
          <button id="reset" class="btn">Reset</button>
        </div>
      </div>
    </section>

    <script type="module" src="app.js"></script>
  </body>
</html>
